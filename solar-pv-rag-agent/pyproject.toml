[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-pv-rag-agent"
version = "0.1.0"
description = "AI Agent 驱动的太阳能光伏材料检索增强推理系统（RAG + 多工具 Agent + RAGAS 评测）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
